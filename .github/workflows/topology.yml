name: Native topology

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-audit:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify Windows audit access and compiler freshness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/ci-tmp | Out-Null
          $taskCanonical = & node -e "process.stdout.write(require('node:fs').realpathSync(process.argv[1]))" (Join-Path $PWD 'build/ci-tmp')
          if ($LASTEXITCODE) { throw 'Cannot resolve the CI temporary directory.' }
          $env:TEMP = $taskCanonical
          $env:TMP = $taskCanonical
          cmake -S native/privacy -B build/audit-acl -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE) { throw 'Audit helper configuration failed.' }
          cmake --build build/audit-acl --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'Audit helper build failed.' }
          ctest --test-dir build/audit-acl -C Release --output-on-failure
          if ($LASTEXITCODE) { throw 'Native audit access tests failed.' }
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { throw 'Workspace dependency installation failed.' }
          pnpm build
          if ($LASTEXITCODE) { throw 'TypeScript build failed.' }
          pnpm test packages/privacy/test/audit.test.ts packages/compiler/test/freshness.test.ts --maxWorkers=2
          if ($LASTEXITCODE) { throw 'Windows audit/freshness tests failed.' }

  native-and-python:
    needs: windows-audit
    # The build uses the VS 2022 generator and the matching Qt MSVC SDK.
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare canonical temporary directory
        shell: pwsh
        run: |
          $taskTemp = Join-Path $env:GITHUB_WORKSPACE 'build/ci-tmp'
          New-Item -ItemType Directory -Force -Path $taskTemp | Out-Null
          $taskCanonical = & node -e "process.stdout.write(require('node:fs').realpathSync(process.argv[1]))" $taskTemp
          if ($LASTEXITCODE) { throw 'Cannot resolve the CI temporary directory.' }
          "TEMP=$taskCanonical" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$taskCanonical" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Build TypeScript owners
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { throw 'Workspace dependency installation failed.' }
          pnpm build
          if ($LASTEXITCODE) { throw 'TypeScript build failed.' }
      - name: Install verified Qt archives
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --index-url https://pypi.org/simple aqtinstall==3.3.0
          python scripts/qt_installer.py install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir .tools/qt --archives qtbase --base https://download.qt.io
          if ($LASTEXITCODE) { throw 'Qt SDK installation failed.' }
      - name: Build and package
        shell: pwsh
        run: ./scripts/build-studio.ps1
      - name: Build and verify local web package
        shell: pwsh
        run: |
          ./scripts/package-local-web.ps1 -NativePackage build/studio -AdminPackage build/studio -OutputDirectory build/studio-web-ci
          ./scripts/verify-local-web.ps1 -PackageDirectory build/studio-web-ci -NativeBuildDirectory build/native
      - name: Windows TypeScript integration tests
        id: typescript
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $PWD '.tools/qt/6.12.0/msvc2022_64/bin') + ';' + $env:PATH
          $env:QT_PLUGIN_PATH = Join-Path $PWD '.tools/qt/6.12.0/msvc2022_64/plugins'
          # The hardened native child uses only its package runtime. Mirror the
          # installed bin/ + plugins/ layout for the CTest executable directory.
          Get-ChildItem -LiteralPath build/studio/bin | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination build/native/bin/Release -Recurse -Force
          }
          Copy-Item -LiteralPath build/studio/plugins -Destination build/native/bin -Recurse -Force
          $env:LMTI_STUDIO_TEST_CLI = Join-Path $PWD 'packages/cli/dist/index.js'
          New-Item -ItemType Directory -Force -Path build/ts-native-runtime | Out-Null
          Copy-Item -LiteralPath build/native/bin/Release -Destination build/ts-native-runtime/bin -Recurse -Force
          Copy-Item -LiteralPath build/studio/plugins -Destination build/ts-native-runtime/plugins -Recurse -Force
          $env:LMTI_MAPPING_CURRENT_NATIVE_RUNTIME = Join-Path $PWD 'build/ts-native-runtime'
          pnpm test --maxWorkers=2
          if ($LASTEXITCODE) { throw 'Windows TypeScript tests failed.' }
      - name: Native integration tests
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $PWD '.tools/qt/6.12.0/msvc2022_64/bin') + ';' + $env:PATH
          $env:QT_PLUGIN_PATH = Join-Path $PWD '.tools/qt/6.12.0/msvc2022_64/plugins'
          $env:LMTI_STUDIO_TEST_CLI = Join-Path $PWD 'packages/cli/dist/index.js'
          ctest --test-dir build/native -C Release --output-on-failure
          if ($LASTEXITCODE) { throw 'Native tests failed.' }
      - name: Python integration tests
        if: ${{ !cancelled() && steps.typescript.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $PWD '.tools/qt/6.12.0/msvc2022_64/bin') + ';' + $env:PATH
          $env:QT_PLUGIN_PATH = Join-Path $PWD '.tools/qt/6.12.0/msvc2022_64/plugins'
          $env:PYTHONPATH = Join-Path $PWD 'python/src'
          $env:LMTI_TOPOLOGY_BINARY = Join-Path $PWD 'build/studio/bin/lmti-topology.exe'
          $env:LMTI_PROJECT_BINARY = Join-Path $PWD 'build/studio/bin/lmti-project.exe'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:LMTI_AGENT_REPO = $PWD.Path
          $env:LMTI_NODE_BINARY = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          $env:LMTI_KNOWLEDGE_CLI = Join-Path $PWD 'packages/cli/dist/index.js'
          $env:LMTI_MAPPING_COMPOSITION_PACKAGE = Join-Path $PWD 'build/studio-web-ci'
          $env:LMTI_MAPPING_COMPOSITION_NATIVE_FIXTURE = Join-Path $PWD 'build/native/bin/Release/lmti-mcp-binding-identity-tests.exe'
          $env:LMTI_MAPPING_COMPOSITION_NODE = $env:LMTI_NODE_BINARY
          $env:LMTI_MAPPING_COMPOSITION_PYTHON = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          & (Join-Path $PWD 'build/native/bin/Release/lmti-project-structure-snapshot-tests.exe') --emit-fixtures (Join-Path $PWD 'build/structure-ci-fixtures')
          if ($LASTEXITCODE) { throw 'Structure integration fixture creation failed.' }
          $env:LMTI_STRUCTURE_FIXTURE_DIR = Join-Path $PWD 'build/structure-ci-fixtures'
          $env:LMTI_STRUCTURE_INTEGRATION_CONFIG = Join-Path $PWD 'build/structure-ci-integration.json'
          @{schema='lmti.agent.integration.v2';projectId='factory-monitor';site='factory-demo';target='external';knowledge=$null;observations=$null;structure=$true} | ConvertTo-Json | Set-Content -LiteralPath $env:LMTI_STRUCTURE_INTEGRATION_CONFIG -Encoding utf8
          node packages/cli/dist/index.js impact demo --out build/impact-ci-demo
          if ($LASTEXITCODE) { throw 'Impact integration fixture creation failed.' }
          $env:LMTI_IMPACT_NODE = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          $env:LMTI_IMPACT_CLI = Join-Path $PWD 'packages/cli/dist/index.js'
          $env:LMTI_IMPACT_CONFIG = Join-Path $PWD 'build/impact-ci-demo/launcher.json'
          python -m unittest discover -s python/tests -v
          if ($LASTEXITCODE) { throw 'Python tests failed.' }
